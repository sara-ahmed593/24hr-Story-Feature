<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A simple Stories app where you can add, view, navigate, and delete stories. Stories automatically disappear after 24 hours.">

    <meta name="keywords" content="stories, story app, add story, view stories, image stories, 24-hour stories">

    <title>Stories</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body>
    <main>
        <div class="stories">
            <h1 class="stories__title">Stories</h1>



            <section class="stories__card">

                <div class="stories__item">
                    <div class="stories__add-btn" id="add-btn">
                        <div class="stories__add-icon">+</div>
                        <input type="file" id="file-input" accept="image/*" hidden />
                    </div>
                    <div class="stories__label">Add Story</div>

                </div>

            </section>


            <section id="story-viewer" class="story-viewer hidden">
                <div id="progress-bar-container" class="story-viewer__progress-container">
                    <div id="progress-bar" class="story-viewer__progress-bar"></div>
                </div>

                <button id="close-viewer" class="story-viewer__close-viewer">
                    X
                </button>
                <button id="delete-btn" class="story-viewer__delete-btn">
                    Delete
                </button>

                <div class="story-viewer__control story-viewer__control-prev-story" id="prev-story"> </div>

                <img id="viewer-image" class="story-viewer__image" src="" alt="Story">

                <div class="story-viewer__control story-viewer__control-next-story" id="next-story"> </div>
            </section>

            <section class="app__content">
                <h2 class="app-__content-title">How to use</h2>

                <p class="app__content-text">Welcome to the Stories App.</p>
                <p class="app__content-text">Add a story using the "+" button above. Click on a story circle to view.
                </p>
                <p class="app__content-text">Stories automatically disappear after 24 hours.</p>
                <p class="app__content-text">Inside the story viewer, you can click on edges to navigate, or click the
                    Delete Button to
                    remove.
                </p>
            </section>
        </div>




    </main>
    <script type="module" src="./src/js/script.js"></script>
</body>

</html>
